name: Themes APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: themes-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android toolchain
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;29.0.14206865' 'cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v5
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: https://github.com/MetaCubeX/go/releases/download/build
          go-version: '1.26'
      - name: Patch Go as required by upstream
        run: |
          cd "$(go env GOROOT)"
          for p in "$GITHUB_WORKSPACE"/.github/patch/*.patch; do patch -p1 < "$p"; done
      - name: Update CA bundle
        run: cp /etc/ssl/certs/ca-certificates.crt core/src/foss/golang/clash/component/ca/ca-certificates.crt
      - name: Configure private signing
        env:
          KEYSTORE: ${{ secrets.THEMES_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.THEMES_KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE" && test -n "$PASSWORD"
          printf '%s' "$KEYSTORE" | base64 --decode > private-release.jks
          printf 'keystore.path=private-release.jks\nkeystore.password=%s\nkey.alias=themes\nkey.password=%s\n' "$PASSWORD" "$PASSWORD" > signing.properties
      - name: Build and lint
        run: ./gradlew --no-daemon :app:assembleMetaRelease :app:lintMetaRelease
      - name: Prepare download and complete corresponding source
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/meta/release/*.apk dist/
          cp LICENSE NOTICE PRIVACY_POLICY.md MODIFICATIONS.md DEVELOPMENT.zh-CN.md dist/
          git rev-parse HEAD > dist/SOURCE_COMMIT.txt
          git submodule status --recursive >> dist/SOURCE_COMMIT.txt
          mkdir source
          git archive HEAD | tar -x -C source
          git -C core/src/foss/golang/clash archive HEAD | tar -x -C source/core/src/foss/golang/clash
          tar -czf dist/corresponding-source.tar.gz -C source .
          cd dist
          sha256sum *.apk corresponding-source.tar.gz > SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: ClashMeta-Themes-Android
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Remove runner signing material
        if: always()
        run: rm -f private-release.jks signing.properties
