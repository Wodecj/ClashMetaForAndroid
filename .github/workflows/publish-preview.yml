# Added by Wodecj, 2026-10-30: publish the already validated, immutable build.
name: Publish verified Themes release
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Themes APK run ID
        required: true
        type: string
      release_tag:
        description: Existing release tag matching that build
        required: true
        type: string
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: Wodecj/ClashMetaForAndroid
      BUILD_RUN_ID: ${{ inputs.run_id }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Download successful immutable build
        run: |
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9][A-Za-z0-9.-]*$ ]]
          test "$(gh run view "$BUILD_RUN_ID" --json conclusion --jq .conclusion)" = success
          test "$(gh run view "$BUILD_RUN_ID" --json workflowName --jq .workflowName)" = 'Themes APK'
          BUILD_SHA=$(gh run view "$BUILD_RUN_ID" --json headSha --jq .headSha)
          gh run download "$BUILD_RUN_ID" -n ClashMeta-Themes-Android -D dist
          test "$(head -1 dist/SOURCE_COMMIT.txt)" = "$BUILD_SHA"
          test "$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq .object.sha)" = "$BUILD_SHA"
      - name: Verify all APK signatures and checksums
        run: |
          cd dist
          sha256sum -c SHA256SUMS.txt
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          test -n "$APKSIGNER"
          for apk in *.apk; do
            "$APKSIGNER" verify --verbose --print-certs "$apk" > "$apk.signature.txt"
            grep -Fi '8044c9ae5e26454f9566beee3549d6dfa0f2dd40c216f7cd68f1d936c41b39af' "$apk.signature.txt"
          done
      - name: Upload verified release assets
        run: |
          gh release view "$RELEASE_TAG"
          gh release upload "$RELEASE_TAG" --clobber dist/*
